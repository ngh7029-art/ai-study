<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="./manifest.webmanifest">
<title>AI STUDY</title><link rel="stylesheet" href="./style.css">
</head>
<body>
<header><div class="brand">AI STUDY <span class="pill">학습 모드</span></div><div class="sub">촬영 · 문제 인식 · AI 해설 · 음성 듣기</div></header>
<main>
<section class="panel">
  <div class="section-title">문제 입력</div>
  <div class="tabs"><button class="tab active" data-tab="camera">카메라</button><button class="tab" data-tab="upload">사진 업로드</button></div>
  <div id="cameraPane">
    <div class="video-wrap"><video id="video" autoplay playsinline muted></video><div id="camHint">카메라를 시작하면 여기에 영상이 표시됩니다.</div></div>
    <div class="actions"><button id="startCam" class="primary">카메라 시작</button><button id="capture" disabled>사진 촬영</button><button id="stopCam" disabled>중지</button></div>
    <p class="hint">외부 Wi-Fi 카메라는 제조사 앱/SDK 또는 표준 스트림 주소 지원 여부에 따라 별도 연동이 필요합니다. 블루투스는 보통 영상 전송보다 기기 제어에 적합합니다.</p>
  </div>
  <div id="uploadPane" class="hidden">
    <label class="upload"><input id="file" type="file" accept="image/*" capture="environment"><span>사진 선택 또는 촬영</span></label>
  </div>
  <img id="preview" class="preview hidden" alt="선택한 문제 이미지">
  <canvas id="canvas" class="hidden"></canvas>
</section>
<section class="panel">
  <div class="section-title">문제 내용</div>
  <textarea id="question" rows="4" placeholder="촬영한 문제를 확인하고, 필요하면 텍스트를 직접 입력하세요."></textarea>
  <div class="actions"><button id="solve" class="primary" disabled>AI 풀이 요청</button><label class="toggle"><input type="checkbox" id="demo" checked> 데모 모드</label></div>
  <p class="hint">데모 모드에서는 예시 결과를 보여줍니다. 실제 AI 풀이를 사용하려면 서버에 AI API를 연결해야 합니다.</p>
</section>
<section class="panel" id="resultPanel">
  <div class="section-title">AI 분석 결과</div>
  <div id="status" class="status">문제를 촬영하거나 사진을 선택하세요.</div>
  <div id="answer" class="answer hidden"></div>
  <div class="actions"><button id="speak" disabled>🔊 음성으로 듣기</button><button id="stopSpeak" disabled>음성 중지</button></div>
</section>
<footer>AI STUDY · 학습 및 모의고사 연습용</footer>
</main>
<script src="./app.js"></script>
</body></html>
